<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Imagem e Ação">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
  :root{
    --azul:#1f4e79; --azul2:#2f6ea5; --verde:#2e8b57; --amarelo:#f2c14e;
    --papel:#f7f3e8; --tinta:#1b2430; --vermelho:#c0392b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--azul);
    color:var(--tinta);
    font-family:"Nunito",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
  }
  h1{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
    color:var(--papel);margin:0 0 16px;font-size:26px;letter-spacing:.5px;
  }
  h1 span{color:var(--amarelo)}
  main{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px;flex:1}
  .carta{
    background:var(--papel);border-radius:18px;border:4px solid var(--tinta);
    box-shadow:0 6px 0 var(--tinta);
    min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px 18px;text-align:center;position:relative;
  }
  .cat{
    position:absolute;top:12px;left:14px;font-size:13px;font-weight:800;
    text-transform:uppercase;letter-spacing:1px;color:var(--azul2);
  }
  .palavra{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
    font-size:clamp(34px,10vw,52px);line-height:1.05;overflow-wrap:anywhere;
  }
  .palavra.vazia{font-size:20px;font-weight:600;color:#6b7280;font-family:"Nunito",sans-serif}
  .relogio{
    background:var(--tinta);color:var(--papel);border-radius:18px;
    padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .tempo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
  .tempo.alerta{color:var(--amarelo)}
  .tempo.fim{color:#ff6b5b}
  .barra{width:100%;height:10px;background:#334155;border-radius:6px;overflow:hidden}
  .barra i{display:block;height:100%;width:100%;background:var(--verde);transition:width .25s linear}
  .botoes{display:grid;grid-template-columns:1fr;gap:12px;margin-top:auto}
  button{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;
    border:4px solid var(--tinta);border-radius:16px;padding:18px 12px;cursor:pointer;
    box-shadow:0 5px 0 var(--tinta);color:var(--tinta);
  }
  button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
  #btnPalavra{background:var(--amarelo)}
  #btnTempo{background:var(--verde);color:#fff}
  #btnTempo.parar{background:var(--vermelho)}
  .rodape{color:#c7d6e6;font-size:13px;text-align:center}
  .placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
  .time{
    background:#16324f;color:var(--papel);border:3px solid #16324f;border-radius:14px;
    padding:8px 6px;text-align:center;cursor:pointer;opacity:.75;
  }
  .time.vez{background:var(--papel);color:var(--tinta);border-color:var(--amarelo);opacity:1;box-shadow:0 4px 0 var(--amarelo)}
  .time .nome{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time .pts{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;line-height:1.1}
  .vezde{color:var(--papel);text-align:center;font-weight:800;font-size:16px;margin-top:-6px}
  .vezde b{color:var(--amarelo)}
  .resultado{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .resultado button{font-size:19px;padding:14px 8px}
  #btnAcertou{background:#7fd1a0}
  #btnErrou{background:#f3a59b}
  .ajustes{display:flex;justify-content:center;gap:14px}
  .ajustes a{color:#c7d6e6;font-size:13px;font-weight:800;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<h1>Imagem <span>&amp;</span> Ação</h1>
<main>
  <section class="placar" id="placar"></section>
  <div class="vezde" id="vezde"></div>

  <section class="carta" aria-live="polite">
    <div class="cat" id="cat"></div>
    <div class="palavra vazia" id="palavra">Toque em "Palavra aleatória"</div>
  </section>

  <section class="relogio">
    <div class="tempo" id="tempo">1:00</div>
    <div class="barra"><i id="barra"></i></div>
  </section>

  <div class="botoes">
    <button id="btnPalavra">🎲 Palavra aleatória</button>
    <button id="btnTempo">▶ Iniciar 1 minuto</button>
    <div class="resultado">
      <button id="btnAcertou">✔ Acertou</button>
      <button id="btnErrou">✘ Não acertou</button>
    </div>
  </div>
  <div class="ajustes">
    <a id="lnkMais">+ time</a><a id="lnkMenos">− time</a><a id="lnkZerar">zerar placar</a>
  </div>
  <div class="rodape" id="rodape">Toque no nome do time para renomear</div>
</main>

const LISTA = Object.entries(PALAVRAS).flatMap(([c,ps]) => ps.map(p => ({c,p})));
let baralho = [];
function embaralhar(){
  baralho = LISTA.slice();
  for(let i=baralho.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[baralho[i],baralho[j]]=[baralho[j],baralho[i]];}
}
const el = id => document.getElementById(id);
function atualizarRodape(){ el("rodape").textContent = `${baralho.length} de ${LISTA.length} palavras restantes · toque no time para renomear`; }
function novaPalavra(){
  if(!baralho.length) embaralhar();
  const {c,p} = baralho.pop();
  el("cat").textContent = c;
  el("palavra").textContent = p;
  el("palavra").classList.remove("vazia");
  atualizarRodape();
}

const DURACAO = 60;
let fim = 0, tick = null, audio = null;
function bip(freq, dur){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.25, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}
function mostrar(rest){
  const s = Math.ceil(rest);
  el("tempo").textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  el("tempo").className = "tempo" + (s===0 ? " fim" : s<=10 ? " alerta" : "");
  el("barra").style.width = (rest/DURACAO*100) + "%";
  el("barra").style.background = s<=10 ? "var(--amarelo)" : "var(--verde)";
}
let ultimoS = DURACAO;
function passo(){
  const rest = Math.max(0,(fim - Date.now())/1000);
  const s = Math.ceil(rest);
  if(s !== ultimoS){ ultimoS = s; if(s<=5 && s>0) bip(880,.12); }
  mostrar(rest);
  if(rest<=0){ parar(true); }
}
function iniciar(){
  bip(660,.15);
  fim = Date.now() + DURACAO*1000; ultimoS = DURACAO;
  clearInterval(tick); tick = setInterval(passo, 100);
  el("btnTempo").textContent = "■ Parar"; el("btnTempo").classList.add("parar");
  mostrar(DURACAO);
}
function parar(acabou){
  clearInterval(tick); tick = null;
  el("btnTempo").textContent = "▶ Iniciar 1 minuto"; el("btnTempo").classList.remove("parar");
  if(acabou){
    bip(440,.9); setTimeout(()=>bip(330,.9),350);
    if(navigator.vibrate) navigator.vibrate([400,150,400]);
    mostrar(0);
  } else { mostrar(DURACAO); el("tempo").className="tempo"; }
}
el("btnPalavra").onclick = novaPalavra;
el("btnTempo").onclick = () => tick ? parar(false) : iniciar();

// ---- Times ----
const CHAVE = "imagem-acao-times";
let jogo = JSON.parse(localStorage.getItem(CHAVE) || "null") ||
  {times:[{n:"Time Azul",p:0},{n:"Time Verde",p:0}], vez:0};
function salvar(){ localStorage.setItem(CHAVE, JSON.stringify(jogo)); }
function desenharPlacar(){
  const pl = el("placar"); pl.innerHTML = "";
  jogo.times.forEach((t,i) => {
    const d = document.createElement("div");
    d.className = "time" + (i===jogo.vez ? " vez" : "");
    d.innerHTML = `<div class="nome"></div><div class="pts">${t.p}</div>`;
    d.querySelector(".nome").textContent = t.n;
    d.onclick = () => {
      const novo = prompt("Nome do time:", t.n);
      if(novo && novo.trim()){ t.n = novo.trim().slice(0,20); salvar(); desenharPlacar(); }
    };
    pl.appendChild(d);
  });
  el("vezde").innerHTML = `Vez do <b></b>`;
  el("vezde").querySelector("b").textContent = jogo.times[jogo.vez].n;
}
function limparCarta(){
  el("cat").textContent = "";
  el("palavra").textContent = 'Toque em "Palavra aleatória"';
  el("palavra").classList.add("vazia");
}
function fecharRodada(acertou){
  if(tick) parar(false); else { mostrar(DURACAO); el("tempo").className="tempo"; }
  if(acertou){ jogo.times[jogo.vez].p++; bip(990,.2); }
  jogo.vez = (jogo.vez + 1) % jogo.times.length;
  salvar(); desenharPlacar(); limparCarta();
}
el("btnAcertou").onclick = () => fecharRodada(true);
el("btnErrou").onclick = () => fecharRodada(false);
const CORES = ["Time Azul","Time Verde","Time Amarelo","Time Vermelho"];
el("lnkMais").onclick = () => {
  if(jogo.times.length >= 4) return alert("Máximo de 4 times.");
  jogo.times.push({n:CORES[jogo.times.length], p:0}); salvar(); desenharPlacar();
};
el("lnkMenos").onclick = () => {
  if(jogo.times.length <= 2) return alert("Mínimo de 2 times.");
  if(!confirm(`Remover ${jogo.times[jogo.times.length-1].n}?`)) return;
  jogo.times.pop(); jogo.vez %= jogo.times.length; salvar(); desenharPlacar();
};
el("lnkZerar").onclick = () => {
  if(!confirm("Zerar o placar de todos os times?")) return;
  jogo.times.forEach(t => t.p = 0); jogo.vez = 0; salvar(); desenharPlacar();
};
desenharPlacar();
embaralhar(); atualizarRodape();
</script>
